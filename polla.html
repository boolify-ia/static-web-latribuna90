<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Polla de Partidos · La Tribuna 90</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --dark: #0d0d0d;
      --dark2: #1a1a1a;
      --dark3: #242424;
      --green: #2d7a3a;
      --white: #f5f5f5;
      --ff-title: 'Bebas Neue', sans-serif;
      --ff-sub: 'Barlow Condensed', sans-serif;
      --ff-body: 'Barlow', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: var(--white); font-family: var(--ff-body); min-height: 100vh; }

    /* NAV */
    nav { background: #0a0a0a; border-bottom: 2px solid var(--gold); padding: .8rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    nav a.logo { font-family: var(--ff-title); font-size: 1.6rem; color: var(--gold); text-decoration: none; letter-spacing: .05em; }
    nav a.back { color: var(--white); text-decoration: none; font-family: var(--ff-sub); font-size: .9rem; opacity: .7; display: flex; align-items: center; gap: .4rem; margin-left: auto; }
    nav a.back:hover { opacity: 1; }

    /* HERO */
    .hero { text-align: center; padding: 3rem 1.5rem 2rem; background: linear-gradient(180deg, #111 0%, var(--dark) 100%); border-bottom: 1px solid #2a2a2a; }
    .hero .badge { display: inline-block; background: var(--gold); color: #000; font-family: var(--ff-sub); font-size: .75rem; font-weight: 700; letter-spacing: .15em; padding: .3rem .8rem; border-radius: 2px; margin-bottom: .8rem; text-transform: uppercase; }
    .hero h1 { font-family: var(--ff-title); font-size: clamp(2.5rem, 7vw, 4.5rem); color: var(--gold); letter-spacing: .03em; line-height: 1; margin-bottom: .5rem; }
    .hero p { font-family: var(--ff-sub); font-size: 1.1rem; opacity: .75; max-width: 500px; margin: 0 auto; }

    /* CONTAINER */
    .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* STEPS */
    .steps { display: flex; gap: 1rem; margin-bottom: 2.5rem; justify-content: center; flex-wrap: wrap; }
    .step { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
    .step-num { width: 2rem; height: 2rem; border-radius: 50%; background: var(--dark3); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--ff-sub); font-weight: 700; font-size: .9rem; color: var(--gold); }
    .step-num.active { background: var(--gold); color: #000; }
    .step-num.done { background: var(--green); border-color: var(--green); color: #fff; }
    .step-label { font-family: var(--ff-sub); font-size: .7rem; opacity: .6; text-transform: uppercase; letter-spacing: .08em; }
    .step-line { width: 40px; height: 2px; background: #333; align-self: center; margin-top: -1.3rem; }

    /* CARDS */
    .card { background: var(--dark2); border: 1px solid #2e2e2e; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { font-family: var(--ff-sub); font-size: 1.1rem; font-weight: 700; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }

    /* FORM */
    .form-row { display: grid; gap: 1rem; margin-bottom: 1rem; }
    .form-row.two { grid-template-columns: 1fr 1fr; }
    @media(max-width:500px){ .form-row.two { grid-template-columns: 1fr; } }
    .field label { display: block; font-family: var(--ff-sub); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: .4rem; }
    .field input { width: 100%; background: var(--dark3); border: 1px solid #3a3a3a; border-radius: 5px; padding: .65rem .9rem; color: var(--white); font-family: var(--ff-body); font-size: .95rem; transition: border-color .2s; }
    .field input:focus { outline: none; border-color: var(--gold); }

    /* MATCH CARDS */
    .match-list { display: flex; flex-direction: column; gap: 1rem; }
    .match-card { background: var(--dark3); border: 1px solid #333; border-radius: 8px; padding: 1rem 1.2rem; }
    .match-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8rem; }
    .match-name { font-family: var(--ff-sub); font-weight: 700; font-size: 1rem; }
    .match-date { font-family: var(--ff-sub); font-size: .75rem; opacity: .5; }
    .teams-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem; }
    .team { text-align: center; }
    .team-name { font-family: var(--ff-sub); font-size: .85rem; font-weight: 600; margin-bottom: .4rem; opacity: .9; }
    .team-emoji { font-size: 1.5rem; margin-bottom: .3rem; }
    .score-input { width: 52px; height: 52px; background: var(--dark); border: 2px solid #3a3a3a; border-radius: 8px; text-align: center; color: var(--gold); font-family: var(--ff-title); font-size: 1.8rem; transition: border-color .2s; -moz-appearance: textfield; }
    .score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .score-input:focus { outline: none; border-color: var(--gold); }
    .vs-sep { font-family: var(--ff-sub); font-size: .8rem; opacity: .4; text-align: center; }

    /* BUTTONS */
    .btn-gold { background: var(--gold); color: #000; border: none; border-radius: 5px; padding: .8rem 2rem; font-family: var(--ff-sub); font-size: 1rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: background .2s, transform .1s; width: 100%; }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-gold:active { transform: translateY(0); }
    .btn-gold:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* STATES */
    .loading-state, .empty-state, .success-state, .error-state { text-align: center; padding: 2.5rem 1rem; }
    .loading-state .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: .8rem; opacity: .4; }
    .empty-state p { font-family: var(--ff-sub); opacity: .5; }
    .success-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .success-state h3 { font-family: var(--ff-title); font-size: 2rem; color: var(--gold); margin-bottom: .5rem; }
    .success-state p { font-family: var(--ff-sub); opacity: .75; margin-bottom: 1.5rem; }
    .error-msg { background: rgba(220,50,50,.15); border: 1px solid rgba(220,50,50,.4); color: #ff7070; border-radius: 5px; padding: .6rem .9rem; font-family: var(--ff-sub); font-size: .9rem; margin-bottom .8rem; display: none; }
    .error-msg.show { display: block; }

    /* ALERT */
    .alert { border-radius: 5px; padding: .6rem .9rem; font-family: var(--ff-sub); font-size: .88rem; margin-top .6rem; }
    .alert-warn { background: rgba(201,168,76,.12); border: 1px solid rgba(201,168,76,.35); color: var(--gold-light); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">La Tribuna 90</a>
  <a class="back" href="index.html"><i class="fas fa-arrow-left"></i> Volver</a>
</nav>

<div class="hero">
  <span class="badge">⚽ Pronósticos</span>
  <h1>La Polla<br>Cancha</h1>
  <p>Predice los resultados, acumula puntos y gana premios en La Tribuna 90</p>
</div>

<div class="container">

  <!-- REGISTRO + PRONÓSTICOS -->
  <div id="app">
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="font-family:var(--ff-sub);opacity:.5">Cargando partidos…</p>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, query, where,
  orderBy, serverTimestamp, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey:"AIzaSyDpSwCwCwGtm2EXML5HWFrajqfKeZMff48",
  authDomain:"latribuna90-static-web.firebaseapp.com",
  projectId:"latribuna90-static-web",
  storageBucket:"latribuna90-static-web.firebasestorage.app",
  messagingSenderId:"961712839386",
  appId:"1:961712839386:web:94e1a3f6a000c7d9a823e3"
}));

const app = document.getElementById('app');

// ── CARGAR PARTIDOS ACTIVOS ────────────────────────────────
let partidos = [];

async function init() {
  try {
    const snap = await getDocs(query(
      collection(db, 'polla_partidos'),
      orderBy('fecha', 'asc')
    ));
    partidos = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(p => p.activo === true);
    renderForm();
  } catch(e) {
    console.error(e);
    const msg = e.code === 'permission-denied'
      ? 'Permisos de base de datos no configurados. Contacta al administrador.'
      : 'Error al cargar partidos. Intenta de nuevo.';
    app.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${msg}</p><p style="font-size:.75rem;opacity:.4;margin-top:.5rem">${e.code||''}</p></div>`;
  }
}

function renderForm() {
  if (partidos.length === 0) {
    app.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚽</div>
        <p>No hay partidos disponibles en este momento.<br>¡Vuelve pronto!</p>
      </div>`;
    return;
  }

  app.innerHTML = `
    <div class="card">
      <h2><i class="fas fa-user"></i> Tus datos</h2>
      <div class="form-row">
        <div class="field">
          <label>Nombre completo *</label>
          <input type="text" id="f-nombre" placeholder="Ej: Carlos Pérez" maxlength="80"/>
        </div>
      </div>
      <div class="form-row two">
        <div class="field">
          <label>Correo electrónico *</label>
          <input type="email" id="f-email" placeholder="tucorreo@gmail.com"/>
        </div>
        <div class="field">
          <label>Celular *</label>
          <input type="tel" id="f-cel" placeholder="300 123 4567" maxlength="15"/>
        </div>
      </div>
      <div id="err-datos" class="error-msg"></div>
    </div>

    <div class="card">
      <h2><i class="fas fa-futbol"></i> Tus pronósticos</h2>
      <div class="match-list" id="match-list"></div>
    </div>

    <button class="btn-gold" id="btn-enviar" onclick="window._enviar()">
      <i class="fas fa-paper-plane"></i>&nbsp; Enviar pronósticos
    </button>
    <div id="err-global" class="error-msg" style="margin-top:.8rem"></div>
  `;

  const list = document.getElementById('match-list');
  partidos.forEach(p => {
    const div = document.createElement('div');
    div.className = 'match-card';
    div.innerHTML = `
      <div class="match-header">
        <span class="match-name">${esc(p.nombre)}</span>
        <span class="match-date">${formatFecha(p.fecha)}</span>
      </div>
      <div class="teams-row">
        <div class="team">
          <div class="team-emoji">${p.emojiLocal || '⚽'}</div>
          <div class="team-name">${esc(p.local)}</div>
        </div>
        <div>
          <div style="display:flex;gap:.4rem;align-items:center">
            <input class="score-input" type="number" min="0" max="99"
              id="score-${p.id}-local" placeholder="0"/>
            <div class="vs-sep">–</div>
            <input class="score-input" type="number" min="0" max="99"
              id="score-${p.id}-visitante" placeholder="0"/>
          </div>
          <div class="vs-sep" style="margin-top:.3rem">Pronóstico</div>
        </div>
        <div class="team">
          <div class="team-emoji">${p.emojiVisitante || '⚽'}</div>
          <div class="team-name">${esc(p.visitante)}</div>
        </div>
      </div>`;
    list.appendChild(div);
  });
}

// ── ENVÍO ──────────────────────────────────────────────────
window._enviar = async function() {
  const btn = document.getElementById('btn-enviar');
  const errD = document.getElementById('err-datos');
  const errG = document.getElementById('err-global');
  errD.classList.remove('show');
  errG.classList.remove('show');

  const nombre = document.getElementById('f-nombre').value.trim();
  const email  = document.getElementById('f-email').value.trim().toLowerCase();
  const cel    = document.getElementById('f-cel').value.trim();

  if (!nombre || !email || !cel) {
    errD.textContent = 'Por favor completa todos tus datos.';
    errD.classList.add('show');
    document.getElementById('f-nombre').scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errD.textContent = 'El correo no parece válido.';
    errD.classList.add('show');
    return;
  }

  // Recoger pronósticos
  const pronosticos = {};
  let incompleto = false;
  for (const p of partidos) {
    const vl = document.getElementById(`score-${p.id}-local`).value;
    const vv = document.getElementById(`score-${p.id}-visitante`).value;
    if (vl === '' || vv === '') { incompleto = true; break; }
    pronosticos[p.id] = { local: parseInt(vl), visitante: parseInt(vv), nombrePartido: p.nombre };
  }
  if (incompleto) {
    errG.textContent = 'Debes ingresar el resultado de todos los partidos.';
    errG.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando…';

  try {
    // Verificar si ya se inscribió con ese email en esta ronda activa
    const yaSnap = await getDocs(query(
      collection(db, 'polla_inscripciones'),
      where('email', '==', email)
    ));
    const yaInscrito = yaSnap.docs.some(d => d.data().rondaActiva === true);
    if (yaInscrito) {
      errG.textContent = 'Ya tienes pronósticos enviados con ese correo. Solo se permite una participación por ronda.';
      errG.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i>&nbsp; Enviar pronósticos';
      return;
    }

    await addDoc(collection(db, 'polla_inscripciones'), {
      nombre, email, cel,
      pronosticos,
      rondaActiva: true,
      creadoEn: serverTimestamp()
    });

    app.innerHTML = `
      <div class="success-state">
        <div class="icon">🏆</div>
        <h3>¡Pronósticos enviados!</h3>
        <p>Gracias <strong>${esc(nombre)}</strong>, tus predicciones quedaron registradas.<br>Sigue los partidos en La Tribuna 90 y descubre si acertaste.</p>
        <a href="index.html" class="btn-gold" style="display:inline-block;text-decoration:none;max-width:260px;margin:0 auto">
          <i class="fas fa-home"></i>&nbsp; Ir al inicio
        </a>
      </div>`;
  } catch(e) {
    console.error(e);
    errG.textContent = 'Error al guardar. Intenta de nuevo en un momento.';
    errG.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i>&nbsp; Enviar pronósticos';
  }
};

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatFecha(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-CO',{ weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

init();
</script>
</body>
</html>
